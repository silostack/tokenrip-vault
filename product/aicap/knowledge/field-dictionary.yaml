      fields: [svc_facility_name, svc_tax_id, svc_provider_type, svc_npi, svc_state_license, svc_medicaid_no, svc_medicare_no, svc_address, svc_county, svc_phone_fax_email, svc_office_hours, svc_handicap_access, svc_accepting_patients, svc_ada_compliant, svc_languages, svc_age_restrictions]
